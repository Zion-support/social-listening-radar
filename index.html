<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Social Listening Radar</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📡 Social Listening Radar</h1><p>Paste social mentions (one per line) for instant sentiment analysis.</p><textarea id="m" rows="5" placeholder="Love the new dashboard!\nSupport was slow today...\nBest IT partner we've had"></textarea><br><button onclick="go()">Analyze sentiment</button><div id="out"></div><script>const pos=/love|great|best|excellent|amazing|happy|fast/i,neg=/bad|slow|worst|hate|terrible|broken|down/i;function go(){const lines=document.getElementById('m').value.split('\n').filter(Boolean);let p=0,n=0,nu=0;lines.forEach(l=>{if(pos.test(l)&&!neg.test(l))p++;else if(neg.test(l))n++;else nu++});const t=lines.length||1;document.getElementById('out').textContent=`Mentions: ${lines.length}\n😊 Positive: ${p} (${Math.round(p/t*100)}%)\n😐 Neutral: ${nu} (${Math.round(nu/t*100)}%)\n😠 Negative: ${n} (${Math.round(n/t*100)}%)\nNet sentiment: ${Math.round((p-n)/t*100)}\n\nReal-time multi-platform listening & competitor SoV: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/social-listening-radar">GitHub</a> · <a href="https://ziontechgroup.com/ai-social-manager/">Social Manager</a></p></body></html>
