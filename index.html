<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Social Listening Radar</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📣 Social Listening Radar</h1><p>Paste social mentions (one per line) for instant sentiment analysis.</p><textarea id="m" rows="5" placeholder="Love the new update!\nTerrible support experience..."></textarea><br><button onclick="go()">Analyze</button><div id="out"></div><script>function go(){const lines=document.getElementById('m').value.split('\n').filter(Boolean);const pos=/love|great|awesome|excellent|happy|best/i,neg=/terrible|bad|awful|hate|worst|broken|slow/i;let p=0,n=0;lines.forEach(l=>{if(pos.test(l))p++;else if(neg.test(l))n++});const t=lines.length||1;document.getElementById('out').textContent=`Mentions analyzed: ${lines.length}\nPositive: ${p} (${Math.round(p/t*100)}%)\nNegative: ${n} (${Math.round(n/t*100)}%)\nNeutral: ${lines.length-p-n}\n\nSentiment score: ${Math.round((p-n)/t*50+50)}/100\n\nEnterprise listening with themes & share-of-voice: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/social-listening-radar">GitHub</a> · <a href="https://ziontechgroup.com/ai-social-manager/">Social Manager</a></p></body></html>
